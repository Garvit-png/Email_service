<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>AI ML Club :: Email Sender</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #000;
      font-family: monospace;
      font-size: 14px;
    }

    /* top bar */
    #topbar {
      background: #000;
      color: #fff;
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #topbar .title { font-weight: bold; letter-spacing: 2px; font-size: 15px; }
    #topbar .sender { font-size: 12px; color: #aaa; }

    /* layout */
    #wrap {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: calc(100vh - 66px);
      border-top: 3px solid #000;
    }

    /* sidebar */
    #sidebar {
      border-right: 2px solid #000;
      padding: 12px;
    }
    #sidebar h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 1px solid #000;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }
    #sidebar input {
      width: 100%;
      border: 1px solid #000;
      padding: 5px 7px;
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 6px;
      outline: none;
    }
    #sidebar input:focus { border-color: #a855f7; }
    #add-btn {
      width: 100%;
      background: #000;
      color: #fff;
      border: none;
      padding: 6px;
      font-family: monospace;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    #add-btn:hover { background: #333; }
    #csv-btn {
      width: 100%;
      background: #fff;
      color: #a855f7;
      border: 1px solid #a855f7;
      padding: 5px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    #csv-btn:hover { background: #faf5ff; }
    #csv-input { display: none; }
    #paste-area {
      width: 100%;
      height: 80px;
      border: 1px dashed #a855f7;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 12px;
      resize: none;
      outline: none;
      color: #000;
      margin-bottom: 6px;
    }
    #paste-area:focus { border-color: #7c3aed; border-style: solid; }
    #parse-btn {
      width: 100%;
      background: #a855f7;
      color: #fff;
      border: none;
      padding: 5px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    #parse-btn:hover { background: #7c3aed; }
    #contact-list { border-top: 1px solid #ccc; }
    .c-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 4px;
      border-bottom: 1px solid #eee;
    }
    .c-row:hover { background: #f5f5f5; }
    .c-name  { font-weight: bold; font-size: 13px; }
    .c-email { font-size: 11px; color: #555; }
    .c-del {
      background: none;
      border: 1px solid #f00;
      color: #f00;
      font-family: monospace;
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
    }
    .c-del:hover { background: #f00; color: #fff; }
    #no-contacts { font-size: 12px; color: #888; padding: 8px 4px; }

    /* main */
    #main { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }

    .sec-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 1px solid #000;
      padding-bottom: 3px;
      margin-bottom: 6px;
    }

    input[type=text], textarea {
      width: 100%;
      border: 1px solid #000;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 13px;
      outline: none;
    }
    input[type=text]:focus, textarea:focus { border-color: #a855f7; }
    textarea { resize: vertical; }
    #body { height: 110px; }

    .hint { font-size: 11px; color: #888; margin-top: 3px; }

    /* highlight box fields */
    .highlight-box {
      border: 1px solid #a855f7;
      padding: 10px 12px;
      border-radius: 4px;
      background: #faf5ff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .highlight-box .box-label {
      font-size: 10px;
      letter-spacing: 1px;
      color: #7c3aed;
      text-transform: uppercase;
      font-weight: bold;
    }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* send bar */
    #sendbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid #000;
      padding: 10px 16px;
      background: #f9f9f9;
    }
    #sendbar .info { font-size: 13px; }
    #sendbar .info b { color: #a855f7; }
    #send-btn {
      background: #000;
      color: #a855f7;
      border: none;
      padding: 10px 28px;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
    }
    #send-btn:hover { background: #1a1a1a; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* preview panel */
    #preview-wrap {
      border-top: 2px solid #000;
      padding: 12px 18px;
    }
    #preview-wrap .sec-label { margin-bottom: 10px; }
    #preview-frame {
      width: 100%;
      height: 420px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* modal */
    #overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      z-index: 99;
    }
    #overlay.open { display: flex; }
    #modal {
      background: #fff;
      border: 2px solid #000;
      padding: 24px;
      width: 440px;
      max-width: 95vw;
      font-family: monospace;
    }
    #modal h2 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; border-bottom: 1px solid #000; padding-bottom: 6px; }
    .r-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .r-sent   { color: #16a34a; font-weight: bold; }
    .r-failed { color: #dc2626; font-weight: bold; }
    .r-name   { font-weight: bold; }
    .r-email  { font-size: 11px; color: #666; }
    #close-btn {
      margin-top: 16px;
      background: #000;
      color: #fff;
      border: none;
      padding: 7px 20px;
      font-family: monospace;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
    }
    #close-btn:hover { background: #333; }

    .preview-btn {
      background: #fff;
      border: 1px solid #000;
      padding: 4px 12px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .preview-btn:hover { background: #f0f0f0; }
  </style>
</head>
<body>

<div id="topbar">
  <span class="title">[ AI ML CLUB :: EMAIL SENDER ]</span>
  <span class="sender">from: <span id="sender-disp">...</span></span>
</div>

<div id="wrap">

  <!-- sidebar -->
  <div id="sidebar">
    <h2>Recipients</h2>
    <textarea id="paste-area" placeholder="Paste names + emails here:&#10;Garvit Gandhi   garvitgandhi@gmail.com&#10;Japinder Kaur   japinder@gmail.com&#10;&#10;Tab, space, or comma separated."></textarea>
    <button id="parse-btn" onclick="parsePaste()">+ PARSE &amp; ADD</button>
    <input id="inp-name"  type="text" placeholder="or add manually — Name" />
    <input id="inp-email" type="text" placeholder="Email" />
    <button id="add-btn" onclick="addContact()">+ ADD</button>
    <input type="file" id="csv-input" accept=".csv" onchange="loadCSV(event)" />
    <button id="csv-btn" onclick="document.getElementById('csv-input').click()">⬆ IMPORT CSV</button>
    <div id="contact-list">
      <div id="no-contacts">No contacts added.</div>
    </div>
  </div>

  <!-- main compose -->
  <div id="main">

    <div>
      <div class="sec-label">Subject</div>
      <input type="text" id="subject" value="Welcome to AIRIS – Onboarding Session Details" />
    </div>

    <div>
      <div class="sec-label">Message Body</div>
      <textarea id="body">We are excited to welcome you to the **Artificial Intelligence and Research Innovation Society (AIRIS)**.

As the next step, we will be conducting the **AIRIS Onboarding Session** on:

**Date:** 18 September 2026 (Friday)

**Time:** 8:30 PM

**Venue:** A409

We look forward to meeting you and beginning this journey together.</textarea>
      <div class="hint">» use {name} for personalization &nbsp;|&nbsp; each paragraph = new line</div>
    </div>

    <!-- highlight box -->
    <div>
      <div class="sec-label">Highlight Box (optional — the purple section)</div>
      <div class="highlight-box">
        <div>
          <div class="box-label">Box Heading</div>
          <input type="text" id="hl-title" placeholder="e.g. What's next?" />
        </div>
        <div>
          <div class="box-label">Box Body</div>
          <input type="text" id="hl-body" placeholder="e.g. We'll share onboarding details soon." />
        </div>
        <div class="two-col">
          <div>
            <div class="box-label">Button Text</div>
            <input type="text" id="btn-text" placeholder="e.g. Join WhatsApp Group" />
          </div>
          <div>
            <div class="box-label">Button URL</div>
            <input type="text" id="btn-url" placeholder="https://..." />
          </div>
        </div>
      </div>
    </div>

    <!-- preview -->
    <div>
      <button class="preview-btn" onclick="updatePreview()">▶ PREVIEW EMAIL</button>
      <iframe id="preview-frame" srcdoc="<p style='font-family:monospace;color:#aaa;padding:20px;'>Click PREVIEW EMAIL to see the rendered template.</p>"></iframe>
    </div>

  </div>
</div>

<!-- send bar -->
<div id="sendbar">
  <div class="info">Sending to <b id="cnt">0</b> recipient(s)</div>
  <button id="send-btn" onclick="sendEmails()">SEND &gt;&gt;</button>
</div>

<!-- modal -->
<div id="overlay">
  <div id="modal">
    <h2>:: Send Results</h2>
    <div id="modal-body"></div>
    <button id="close-btn" onclick="closeModal()">CLOSE</button>
  </div>
</div>

<script>
  let contacts = [];
  let senderEmail = '';

  fetch('/api/config').then(r=>r.json()).then(d=>{
    senderEmail = d.sender;
    document.getElementById('sender-disp').textContent = d.sender;
  });

  function parsePaste() {
    const raw = document.getElementById('paste-area').value.trim();
    if (!raw) return alert('Paste something first.');

    const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    let added = 0, skipped = 0;

    for (const line of lines) {
      // split on tab, multiple spaces, or comma
      const parts = line.split(/[\t,]+|\s{2,}/).map(p => p.trim()).filter(p => p.length > 0);
      if (parts.length < 2) { skipped++; continue; }

      // find which part is the email (contains @)
      const emailIdx = parts.findIndex(p => p.includes('@'));
      if (emailIdx === -1) { skipped++; continue; }

      const email = parts[emailIdx];
      // everything except the email part = name
      const name  = parts.filter((_, i) => i !== emailIdx).join(' ');

      if (!name) { skipped++; continue; }
      if (contacts.find(c => c.email === email)) { skipped++; continue; }

      contacts.push({ name, email });
      added++;
    }

    document.getElementById('paste-area').value = '';
    render();
    if (added > 0) alert(`Added ${added} contact(s).${skipped > 0 ? ` Skipped ${skipped}.` : ''}`);
    else alert('No valid contacts found. Make sure each line has a name and email.');
  }

  function loadCSV(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 2) return alert('CSV is empty or has no data rows.');

      // detect header row — find name and email column indexes (case-insensitive)
      const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g,''));
      const nameIdx  = headers.findIndex(h => h === 'name');
      const emailIdx = headers.findIndex(h => h === 'email');

      if (nameIdx === -1 || emailIdx === -1) {
        return alert('CSV must have "name" and "email" columns in the header row.');
      }

      let added = 0, skipped = 0;
      for (let i = 1; i < lines.length; i++) {
        const cols  = lines[i].split(',').map(c => c.trim().replace(/"/g,''));
        const name  = cols[nameIdx]  || '';
        const email = cols[emailIdx] || '';
        if (!name || !email || !email.includes('@')) { skipped++; continue; }
        if (contacts.find(c => c.email === email))   { skipped++; continue; }
        contacts.push({ name, email });
        added++;
      }
      // reset file input so same file can be re-imported if needed
      event.target.value = '';
      render();
      alert(`Imported ${added} contact(s). Skipped ${skipped}.`);
    };
    reader.readAsText(file);
  }

  function addContact() {
    const name  = document.getElementById('inp-name').value.trim();
    const email = document.getElementById('inp-email').value.trim();
    if (!name || !email) return alert('Enter name and email.');
    if (!email.includes('@')) return alert('Invalid email.');
    if (contacts.find(c=>c.email===email)) return alert('Already added.');
    contacts.push({name, email});
    document.getElementById('inp-name').value  = '';
    document.getElementById('inp-email').value = '';
    render();
  }

  function removeContact(email) {
    contacts = contacts.filter(c=>c.email!==email);
    render();
  }

  function render() {
    document.getElementById('cnt').textContent = contacts.length;
    const list = document.getElementById('contact-list');
    if (!contacts.length) {
      list.innerHTML = '<div id="no-contacts">No contacts added.</div>';
      return;
    }
    list.innerHTML = contacts.map(c=>`
      <div class="c-row">
        <div>
          <div class="c-name">${esc(c.name)}</div>
          <div class="c-email">${esc(c.email)}</div>
        </div>
        <button class="c-del" onclick="removeContact('${esc(c.email)}')">DEL</button>
      </div>`).join('');
  }

  function buildPreviewHTML(name) {
    const body         = document.getElementById('body').value.trim();
    const hlTitle      = document.getElementById('hl-title').value.trim();
    const hlBody       = document.getElementById('hl-body').value.trim();
    const btnText      = document.getElementById('btn-text').value.trim();
    const btnUrl       = document.getElementById('btn-url').value.trim();

    const personalizedBody = body.replace(/\{name\}/gi, name);

    const bodyHtml = personalizedBody
      .split('\n').map(l=>l.trim()).filter(l=>l.length>0)
      .map(l => {
        l = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        return `<p style="margin:0 0 10px 0;color:#374151;font-size:14px;line-height:1.7;">${l}</p>`;
      }).join('');

    const hlBlock = (hlTitle || hlBody) ? `
      <div style="border-left:4px solid #a855f7;background:#faf5ff;padding:14px 18px;margin:20px 0;border-radius:0 6px 6px 0;">
        ${hlTitle ? `<p style="margin:0 0 6px 0;font-weight:bold;color:#7c3aed;font-size:15px;">${hlTitle}</p>` : ''}
        ${hlBody  ? `<p style="margin:0 0 12px 0;color:#374151;font-size:13px;">${hlBody}</p>` : ''}
        ${btnText && btnUrl ? `<a href="${btnUrl}" style="display:inline-block;background:#a855f7;color:#fff;padding:10px 22px;border-radius:5px;text-decoration:none;font-size:13px;font-weight:bold;">${btnText}</a>` : ''}
      </div>` : '';

    return `<!DOCTYPE html><html><head><meta charset="UTF-8"/></head>
    <body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:30px 0;">
    <tr><td align="center">
    <table width="580" cellpadding="0" cellspacing="0" style="max-width:580px;width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
      <tr>
        <td style="background:#000;padding:28px 40px;text-align:center;">
          <img src="/logo.png" alt="AIRIS" style="max-height:240px;max-width:100%;display:inline-block;" />
        </td>
      </tr>
      <tr>
        <td style="padding:36px 40px;color:#111;font-size:14px;line-height:1.7;">
          <p style="margin:0 0 16px 0;font-size:14px;color:#374151;">Dear <strong>${name}</strong>,</p>
          ${bodyHtml}
          ${hlBlock}
          <p style="margin:28px 0 4px 0;font-size:14px;color:#374151;"><strong>Best regards,</strong></p>
          <p style="margin:0 0 2px 0;font-size:15px;font-weight:bold;color:#111;">Japinder Kaur</p>
          <p style="margin:0;font-size:13px;color:#6b7280;">General Secretary (AIRIS)</p>
        </td>
      </tr>
    </table>
    </td></tr></table>
    </body></html>`;
  }

  function updatePreview() {
    const previewName = contacts.length > 0 ? contacts[0].name : 'Garvit';
    const html = buildPreviewHTML(previewName);
    document.getElementById('preview-frame').srcdoc = html;
  }

  async function sendEmails() {
    if (!contacts.length) return alert('No recipients.');
    const subject  = document.getElementById('subject').value.trim();
    const body     = document.getElementById('body').value.trim();
    const hlTitle  = document.getElementById('hl-title').value.trim();
    const hlBody   = document.getElementById('hl-body').value.trim();
    const btnText  = document.getElementById('btn-text').value.trim();
    const btnUrl   = document.getElementById('btn-url').value.trim();
    if (!subject) return alert('Enter a subject.');
    if (!body)    return alert('Write a message.');

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.textContent = 'SENDING...';

    try {
      const res = await fetch('/api/send', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ contacts, subject, body, highlightTitle: hlTitle, highlightBody: hlBody, buttonText: btnText, buttonUrl: btnUrl })
      });
      const data = await res.json();
      showResults(data.results);
    } catch(e) {
      alert('Error: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'SEND >>';
    }
  }

  function showResults(results) {
    document.getElementById('modal-body').innerHTML = results.map(r=>`
      <div class="r-row">
        <div>
          <div class="r-name">${esc(r.name)}</div>
          <div class="r-email">${esc(r.email)}</div>
        </div>
        <span class="${r.status==='sent'?'r-sent':'r-failed'}">${r.status==='sent'?'[OK]':'[FAIL]'}</span>
      </div>`).join('');
    document.getElementById('overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('inp-name').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('inp-email').focus(); });
  document.getElementById('inp-email').addEventListener('keydown', e=>{ if(e.key==='Enter') addContact(); });
</script>
</body>
</html>
